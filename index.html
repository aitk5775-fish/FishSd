<!DOCTYPE html>
<html lang="en">

<head>

<title>FishSd — Chess Analysis</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #071018;
    --panel: #0d1822;
    --panel2: #111f2b;
    --border: #1d3445;
    --text: #e8f1f7;
    --muted: #8da0af;
    --green: #19d39a;
    --green-dark: #0d6f57;
    --light-square: #e8d7b5;
    --dark-square: #71896c;
}

body {
    background:
        radial-gradient(circle at 50% 0%, #122532 0%, var(--bg) 45%);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* HEADER */

header {
    height: 72px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 38px;
    background: rgba(7,16,24,.92);
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: var(--green);
}

.logo small {
    color: var(--muted);
    font-size: 13px;
    font-weight: normal;
    margin-left: 12px;
}

nav {
    display: flex;
    gap: 38px;
}

nav a {
    color: #c8d4dc;
    text-decoration: none;
    padding: 25px 5px;
    font-size: 15px;
}

nav a.active,
nav a:hover {
    color: var(--green);
    border-bottom: 2px solid var(--green);
}

/* MAIN */

.main {
    max-width: 1500px;
    margin: auto;
    padding: 25px 20px 0;

    display: grid;
    grid-template-columns: 255px minmax(450px, 1fr) 300px;
    gap: 18px;
}

.panel {
    background: linear-gradient(145deg, #0e1923, #0b151e);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: 0 10px 30px rgba(0,0,0,.22);
}

/* LEFT */

.left-panel {
    padding: 22px;
    align-self: start;
}

.section-title {
    color: #cbd7df;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 18px;
    letter-spacing: .5px;
}

.section-title::before {
    content: "♟";
    color: var(--green);
    margin-right: 9px;
}

.divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
}

label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
}

select,
.action-btn {
    width: 100%;
    height: 48px;
    border: 1px solid #294052;
    border-radius: 8px;
    background: #16232f;
    color: white;
    padding: 0 14px;
    font-size: 14px;
}

.action-btn {
    cursor: pointer;
    margin-bottom: 10px;
    transition: .2s;
}

.action-btn:hover {
    border-color: var(--green);
    background: #172d32;
}

.upload {
    border-color: var(--green-dark);
}

.analyze-btn {
    border-color: var(--green);
    color: var(--green);
    font-weight: bold;
}

.analyze-btn:hover {
    background: #12352f;
}

.stop-btn {
    border-color: #7d3940;
    color: #ff8992;
}

.engine-box {
    margin-bottom: 22px;
}

/* ENGINE STATUS */

.engine-status {
    margin-top: 12px;
    padding: 11px;
    border-radius: 8px;
    background: #09131c;
    border: 1px solid #20384a;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
}

.engine-status.ready {
    color: var(--green);
}

.engine-status.error {
    color: #ff8992;
}

/* CENTER */

.center {
    min-width: 0;
}

.board-panel {
    padding: 20px;
}

.board-wrapper {
    width: 100%;
    max-width: 650px;
    margin: auto;
    position: relative;
    border: 7px solid #162633;
    box-shadow: 0 15px 45px rgba(0,0,0,.45);
}

.board {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    touch-action: none;
}

.square {
    aspect-ratio: 1;
    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    font-family:
        "Arial Unicode MS",
        "Segoe UI Symbol",
        sans-serif;

    font-size: clamp(25px, 5vw, 55px);
    line-height: 1;
    user-select: none;

    cursor: grab;
    touch-action: none;
}

.square:active {
    cursor: grabbing;
}

/* CHESS PIECE IMAGES */

.square img {
    width: 88%;
    height: 88%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

.light {
    background: var(--light-square);
}

.dark {
    background: var(--dark-square);
}

.black-piece {
    color: #11151a;
    text-shadow: 1px 2px 1px rgba(255,255,255,.2);
}

.white-piece {
    color: #fff;
    text-shadow: 1px 2px 2px rgba(0,0,0,.5);
}

/* SELECTED SQUARE */

.square.selected {
    box-shadow:
        inset 0 0 0 5px rgba(25,211,154,.9);
}

/* LEGAL MOVE */

.square.legal-move::after {
    content: "";
    position: absolute;
    width: 23%;
    height: 23%;
    border-radius: 50%;
    background: rgba(25,211,154,.78);
    pointer-events: none;
}

/* CAPTURE MOVE */

.square.capture-move::after {
    content: "";
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    border: 5px solid rgba(25,211,154,.82);
    pointer-events: none;
}

/* LAST MOVE */

.square.last-move {
    box-shadow: inset 0 0 0 4px rgba(255,214,70,.55);
}

/* CHECK */

.square.in-check {
    box-shadow:
        inset 0 0 0 6px rgba(255,70,70,.85);
}

/* BOARD COORDINATES */

.coordinates {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.file-label,
.rank-label {
    position: absolute;
    font-size: 11px;
    font-weight: bold;
    color: rgba(0,0,0,.6);
}

.file-label {
    bottom: 2px;
}

.rank-label {
    left: 3px;
}

/* CONTROLS */

.controls-panel {
    margin-top: 16px;
    padding: 15px 22px;
}

.controls {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.control-btn {
    height: 52px;
    border-radius: 8px;
    border: 1px solid #294052;
    background: #16232f;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.control-btn:hover {
    border-color: var(--green);
    color: var(--green);
}

.control-btn:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.move-list {
    background: #09131c;
    border-radius: 8px;
    padding: 14px;
    color: #c5d0d8;
    font-size: 15px;
    line-height: 1.8;
    min-height: 50px;
    overflow-x: auto;
    white-space: nowrap;
}

/* GRAPH */

.graph-panel {
    margin-top: 16px;
    padding: 20px;
}

.graph-title {
    font-size: 14px;
    margin-bottom: 18px;
}

.graph {
    height: 150px;
    position: relative;
    border-left: 1px solid #294052;
    border-bottom: 1px solid #294052;

    background:
        linear-gradient(
            to bottom,
            transparent 49.5%,
            #294052 50%,
            transparent 50.5%
        );
}

.graph::before {
    content: "+3.0\A +1.5\A  0.0\A -1.5\A -3.0";
    white-space: pre;
    position: absolute;
    left: -38px;
    top: -4px;
    line-height: 31px;
    color: #718392;
    font-size: 10px;
}

.graph-line {
    position: absolute;
    left: 0;
    right: 0;
    top: 54%;
    height: 3px;
    background: var(--green);
    transform: rotate(-3deg);
    box-shadow: 0 0 8px rgba(25,211,154,.5);
}

/* RIGHT */

.right-panel {
    padding: 22px;
    align-self: start;
}

.analysis-title {
    font-size: 14px;
    margin-bottom: 18px;
}

.analysis-title::before {
    content: "◈";
    color: var(--green);
    margin-right: 9px;
}

.evaluation {
    font-size: 46px;
    font-weight: 800;
    color: var(--green);
    margin-bottom: 22px;
}

.info-card {
    background: #111f2b;
    border: 1px solid #20384a;
    border-radius: 9px;
    padding: 17px;
    margin-bottom: 14px;
}

.info-label {
    color: #aebdca;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 10px;
}

.best-move {
    color: var(--green);
    font-size: 26px;
    font-weight: bold;
}

.depth {
    color: white;
    font-size: 23px;
}

.candidate-title {
    color: #aebdca;
    font-size: 13px;
    margin-bottom: 15px;
}

.candidate {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #1d303f;
    color: #d5dfe5;
}

.candidate:last-child {
    border-bottom: 0;
}

.candidate span {
    color: var(--green);
}

/* ENGINE THINKING */

.engine-thinking {
    color: var(--green);
    font-size: 12px;
    margin-top: -8px;
    margin-bottom: 15px;
    display: none;
}

.engine-thinking.show {
    display: block;
}

/* FOOTER */

footer {
    max-width: 1500px;
    margin: 25px auto 0;
    padding: 30px 20px;
    border-top: 1px solid var(--border);
    text-align: center;
}

.footer-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 20px;
}

.socials {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
}

.socials a {
    color: var(--green);
    text-decoration: none;
    font-size: 13px;
}

.socials a:hover {
    text-decoration: underline;
}

.developer {
    color: var(--muted);
    margin-top: 18px;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 1050px) {

    header {
        padding: 0 20px;
    }

    .main {
        grid-template-columns: 220px minmax(400px,1fr);
    }

    .right-panel {
        grid-column: 1 / -1;
    }
}

@media (max-width: 720px) {

    header {
        height: auto;
        min-height: 65px;
        padding: 14px 16px;
        gap: 10px;
    }

    .logo {
        font-size: 25px;
    }

    .logo small {
        display: none;
    }

    nav {
        gap: 12px;
    }

    nav a {
        font-size: 12px;
        padding: 10px 2px;
    }

    .main {
        display: flex;
        flex-direction: column;
        padding: 14px 10px;
        gap: 12px;
    }

    .left-panel {
        order: 1;
    }

    .center {
        order: 2;
    }

    .right-panel {
        order: 3;
    }

    .board-panel {
        padding: 9px;
    }

    .board-wrapper {
        border-width: 5px;
    }

    .square {
        font-size: clamp(25px, 10vw, 45px);
    }

    .square img {
        width: 88%;
        height: 88%;
    }

    .controls-panel {
        padding: 12px;
    }

    .control-btn {
        height: 48px;
    }

    .graph-panel {
        margin-top: 12px;
    }

    footer {
        margin-top: 10px;
        padding: 25px 12px;
    }
}

</style>

</head>
